[project]
name = "whisper-transcribe"
version = "0.1.0"
description = "Transcribe audio files (m4a, mp3, ...) to .txt using OpenAI Whisper."
readme = "README.md"
authors = [
    { name = "sciencemj", email = "sciencemj.park@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai-whisper>=20240930",
    "silero-vad>=5.0",
]

[project.scripts]
whisper-transcribe = "whisper_transcribe:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
